name: Validate skill bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check references, frontmatter, catalog/template consistency, and size budgets
        run: bash scripts/check-refs.sh

  maintenance-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Run maintenance tooling behavior tests
        run: python -m unittest discover -s tests/maintenance -p 'test_*.py'

  behavior-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate behavior scenario materials
        run: python scripts/check-behavior.py validate --cases tests/behavior/cases

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check plugin version and CHANGELOG consistency
        run: python scripts/check-version.py consistency

  version-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require plugin version bump when skill content changes
        run: python scripts/check-version.py bump --base-ref "origin/${{ github.base_ref }}"
